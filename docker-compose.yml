version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5001:5001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/fortifi
      - PORT=5001
      - MNEMONIC=${MNEMONIC}
      - INFURA_API_KEY=${INFURA_API_KEY}
      - RPC_URL=http://ganache:7545
    depends_on:
      - mongodb
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001
    depends_on:
      - backend
    restart: always

volumes:
  mongodb_data:
